apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mahi-ai-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - mahi-ai.127.0.0.1.sslip.io
      secretName: mahi-ai-tls
  rules:
    - host: mahi-ai.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mahi-frontend
                port:
                  number: 80
